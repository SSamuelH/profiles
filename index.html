    <style>
        /* 全局样式重置+基础配置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        /* 下载容器卡片样式（核心美观样式，保留原版质感） */
        .download-container {
            background: #ffffff;
            width: 100%;
            max-width: 1200px; /* 加宽适配多栏 */
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f2f5;
        }
        /* 总标题样式 */
        .container-title {
            text-align: center;
            color: #1f2937;
            font-size: 26px;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        /* ✅ 核心：多目录分栏布局容器 */
        .catalogs-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; /* 栏与栏之间的间距 */
            margin-bottom: 30px;
        }
        /* ✅ 单个目录分组样式 */
        .catalog-item {
            padding: 25px 20px;
            background: #f9fafb;
            border-radius: 12px;
            border: 1px solid #f0f2f5;
        }
        /* 目录分组标题样式 */
        .catalog-title {
            color: #1f2937;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-left: 8px;
            border-left: 4px solid #165dff; /* 蓝色侧边线，醒目 */
        }
        /* 文件列表样式 */
        .file-list {
            list-style: none;
        }
        /* 单个下载链接样式（完全保留原版，动效不变） */
        /* ✅ 核心：单个文件容器 - 实现双按钮同行 */
        .file-item {
            margin-bottom: 18px;
            /* 弹性布局：让两个按钮并排 */
            display: flex;
            gap: 10px; /* 两个按钮之间的间距 */
        }
        /* ✅ 通用按钮基础样式（统一尺寸、圆角、动效） */
        .file-btn {
            flex: 1; /* 关键：两个按钮平分宽度，保证同行对齐 */
            display: block;
            padding: 12px 8px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        /* ✅ 查看按钮样式（蓝色主题，适配预览） */
        .view-btn {
            background: #e8f3ff;
            color: #165dff;
        }
        .view-btn:hover {
            background: #165dff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.2);
        }
        /* ✅ 下载按钮样式（深灰主题，适配下载） */
        .download-btn {
            width: 50px;
            background: #f3f4f6;
            color: #4b5563;
        }
        .download-btn:hover {
            background: #4b5563;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(75, 85, 99, 0.2);
        }
        /* 按钮前置图标（区分功能） */
        .view-btn::before { content: "📄 "; }
        .download-btn::before { content: "⬇️ "; }
        .phone-btn::before { content: "📱 "; }
        .download-btn::before { content: "⬇️ "; }
        /* 底部提示文字 */
        .tips {
            margin-top: 10px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
